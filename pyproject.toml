[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duallevelaug-reproduction"
version = "0.1.0"
description = "Graph-guided augmentation for 3D scene segmentation"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["point-cloud", "data-augmentation", "semantic-segmentation", "scene-graph"]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
geometry = ["open3d==0.18.0", "plyfile==1.0.3"]
graph = ["torch==2.5.1"]
plots = ["matplotlib==3.9.2", "scikit-learn==1.5.2"]
test = ["pytest==8.3.3"]

[project.scripts]
dla = "duallevelaug.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["duallevelaug*"]
namespaces = false

[tool.setuptools.package-data]
"duallevelaug.resources" = ["*.json"]

# Separate backend CUDA environments, not controller extras.

[tool.duallevelaug.backends.pointcept]
python = "3.10"
cuda = "12.4"
bootstrap = ["torch", "torchvision", "numpy", "packaging"]
bootstrap_pip_options = [
  "--find-links",
  "https://download.pytorch.org/whl/torch_stable.html",
  "--extra-index-url",
  "https://download.pytorch.org/whl/cu124",
]
pip_options = [
  "--extra-index-url",
  "https://download.pytorch.org/whl/cu124",
  "--find-links",
  "https://data.pyg.org/whl/torch-2.5.0+cu124.html",
